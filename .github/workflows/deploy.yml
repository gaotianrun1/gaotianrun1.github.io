name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      # The 3D desk (desk-src/, React + three.js) is served at /desk/ and
      # replaces the placeholder page Jekyll wrote there.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desk-src/package-lock.json

      - name: Build desk
        working-directory: desk-src
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Add desk to site
        run: |
          rm -rf _site/desk
          cp -R desk-src/dist _site/desk

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
